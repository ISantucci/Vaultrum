<text x="425" y="392" font-size="11.5" fill="#1A1A1A" font-weight="600" text-anchor="middle">está</text>
<polygon points="589,350 781,350 795,394.0 781,438 589,438 575,394.0" fill="#EAF6EC" stroke="#3F8A4E" stroke-width="1.6"/>
<text x="685" y="391" font-size="11.5" fill="#14401E" font-weight="400" text-anchor="middle">legibilidad.py — contraste WCAG ·</text>
<text x="685" y="405" font-size="11.5" fill="#14401E" font-weight="400" text-anchor="middle">daltonismo · mapping · densidad</text>

<text x="75" y="489" font-size="11" fill="#6A6A6A" font-weight="400" text-anchor="start">Es el único artefacto que abre ANTES que su insumo principal: por eso declara dos insumos y no uno.</text>
