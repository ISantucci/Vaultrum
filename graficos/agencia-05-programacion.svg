<defs><marker id="f" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5A5A5A"/></marker><marker id="fr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#C0504D"/></marker></defs>
<text x="75" y="42" font-size="21" font-weight="600" fill="#1A1A1A">Área de Programación</text>
<text x="75" y="66" font-size="12.5" fill="#6A6A6A">Cuatro sub-agentes en loop. El loop no cierra hasta que el Revisor da OK. Consume el paquete de diseño y produce SOL + EJ.</text>
