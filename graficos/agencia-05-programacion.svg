<path d="M 325,506 L 281,506 L 281,256 L 325,256" fill="none" stroke="#C0504D" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#fr)"/>
<rect x="183" y="372" width="197" height="16" rx="3" fill="#FFFFFF" opacity="0.94"/>
<text x="281" y="384" font-size="10.5" fill="#C0504D" text-anchor="middle">hallazgo de diseno: reabre el SOL</text>
<rect x="75" y="100" width="200" height="62" rx="14" fill="#EAF2FB" stroke="#4A7EBB" stroke-width="1.6"/>
<text x="175" y="128" font-size="11.5" fill="#1B3A5C" font-weight="400" text-anchor="middle">RQ + GDS (+ LDS / UXS si</text>
<text x="175" y="142" font-size="11.5" fill="#1B3A5C" font-weight="400" text-anchor="middle">existen)</text>
<rect x="325" y="100" width="200" height="62" rx="3" fill="#FFFFFF" stroke="#3D3D3D" stroke-width="1.6"/>
<text x="425" y="128" font-size="11.5" fill="#1A1A1A" font-weight="600" text-anchor="middle">1 · Analista Técnico — lee el</text>
<text x="425" y="142" font-size="11.5" fill="#1A1A1A" font-weight="600" text-anchor="middle">proyecto real</text>
<rect x="325" y="225" width="200" height="62" rx="3" fill="#FFFFFF" stroke="#3D3D3D" stroke-width="1.6"/>
<text x="425" y="253" font-size="11.5" fill="#1A1A1A" font-weight="600" text-anchor="middle">2 · Diseñador de Solución —</text>
<text x="425" y="267" font-size="11.5" fill="#1A1A1A" font-weight="600" text-anchor="middle">acá se decide</text>
<rect x="575" y="225" width="200" height="62" rx="3" fill="#FFF4E0" stroke="#C98A2B" stroke-width="1.6"/>
<text x="675" y="253" font-size="11.5" fill="#5C3B08" font-weight="400" text-anchor="middle">SOL-XXX.n + Contrato de</text>
<text x="675" y="267" font-size="11.5" fill="#5C3B08" font-weight="400" text-anchor="middle">ejecución</text>
<rect x="825" y="225" width="200" height="62" rx="14" fill="#FDE9E9" stroke="#C0504D" stroke-width="1.6"/>
<text x="925" y="260" font-size="11.5" fill="#5C1A18" font-weight="600" text-anchor="middle">GATE: aprobación del alcance</text>
<rect x="325" y="350" width="200" height="62" rx="3" fill="#FFFFFF" stroke="#3D3D3D" stroke-width="1.6"/>
<text x="425" y="378" font-size="11.5" fill="#1A1A1A" font-weight="600" text-anchor="middle">3 · Ejecutor Técnico — solo</text>
<text x="425" y="392" font-size="11.5" fill="#1A1A1A" font-weight="600" text-anchor="middle">tras el OK</text>
<rect x="575" y="350" width="200" height="62" rx="3" fill="#FFF4E0" stroke="#C98A2B" stroke-width="1.6"/>
<text x="675" y="385" font-size="11.5" fill="#5C3B08" font-weight="400" text-anchor="middle">EJ-XXX.n</text>
<rect x="825" y="350" width="200" height="62" rx="14" fill="#FDE9E9" stroke="#C0504D" stroke-width="1.6"/>
<text x="925" y="385" font-size="11.5" fill="#5C1A18" font-weight="600" text-anchor="middle">GATE: existencia en disco</text>
<rect x="325" y="475" width="200" height="62" rx="3" fill="#FFFFFF" stroke="#3D3D3D" stroke-width="1.6"/>
<text x="425" y="510" font-size="11.5" fill="#1A1A1A" font-weight="600" text-anchor="middle">4 · Revisor Técnico</text>
<rect x="75" y="350" width="220" height="88" rx="3" fill="#F2F2F2" stroke="#9A9A9A" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="185" y="384" font-size="11.5" fill="#4A4A4A" font-weight="400" text-anchor="middle">Despacho: SOL con contrato →</text>
<text x="185" y="398" font-size="11.5" fill="#4A4A4A" font-weight="400" text-anchor="middle">ejecutor barato. Donde se decide</text>
<text x="185" y="411" font-size="11.5" fill="#4A4A4A" font-weight="400" text-anchor="middle">→ modelo fuerte</text>
<rect x="825" y="475" width="200" height="62" rx="3" fill="#F2F2F2" stroke="#9A9A9A" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="925" y="510" font-size="11.5" fill="#4A4A4A" font-weight="400" text-anchor="middle">Calidad → QA</text>
</svg>