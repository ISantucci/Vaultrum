<text x="75" y="482" font-size="11" fill="#6A6A6A" font-weight="400" text-anchor="start">La lectura usa el MISMO KPI que congeló el plan: si no, es metric shopping y rebota al 03. Nace sin caso: el primer MET real confirma o funde</text>
